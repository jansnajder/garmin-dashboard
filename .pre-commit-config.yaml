repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run --directory backend ruff check --fix .
        language: system
        types: [python]
        pass_filenames: false

      - id: oxlint
        name: oxlint
        entry: npm --prefix frontend run lint
        language: system
        files: ^frontend/.*\.(ts|tsx)$
        pass_filenames: false

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        files: ^frontend/.*\.(js|jsx|ts|tsx|css|html)$
