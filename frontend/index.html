<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Garmin Dashboard</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Garmin Dashboard</h1>
      <span id="date-label"></span>
      <button id="refresh-btn">Refresh</button>
    </header>

    <main>
      <section class="card-row">
        <div class="card">
          <div class="card-label">Steps</div>
          <div class="card-value" id="val-steps">--</div>
          <div class="card-sub" id="val-steps-goal"></div>
        </div>
        <div class="card">
          <div class="card-label">Sleep Score</div>
          <div class="card-value" id="val-sleep">--</div>
        </div>
        <div class="card">
          <div class="card-label">Body Battery</div>
          <div class="card-value" id="val-bb">--</div>
        </div>
        <div class="card">
          <div class="card-label">Resting HR</div>
          <div class="card-value" id="val-hr">--</div>
          <div class="card-sub">bpm</div>
        </div>
        <div class="card">
          <div class="card-label">HRV</div>
          <div class="card-value" id="val-hrv">--</div>
          <div class="card-sub" id="val-hrv-status"></div>
        </div>
      </section>

      <section class="chart-row">
        <div class="chart-card">
          <h2>Heart Rate Today</h2>
          <div class="chart-wrap"><canvas id="chart-hr"></canvas></div>
        </div>
        <div class="chart-card">
          <h2>Sleep Stages</h2>
          <div class="chart-wrap"><canvas id="chart-sleep"></canvas></div>
        </div>
        <div class="chart-card">
          <h2>HRV Trend</h2>
          <div class="chart-wrap"><canvas id="chart-hrv"></canvas></div>
        </div>
      </section>

      <section id="activities-section">
        <h2>Recent Activities</h2>
        <table id="activities-table">
          <thead>
            <tr>
              <th>Date</th>
              <th>Activity</th>
              <th>Duration</th>
              <th>Distance</th>
              <th>Avg HR</th>
              <th>Calories</th>
            </tr>
          </thead>
          <tbody id="activities-body"></tbody>
        </table>
      </section>
    </main>

    <script src="chart.umd.min.js"></script>
    <script src="chartjs-adapter-date-fns.bundle.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
